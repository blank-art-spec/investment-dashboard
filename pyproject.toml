# 本项目以源码目录运行；此文件只统一可选静态检查设置，不声明构建后端。
# 运行依赖的唯一维护位置是 requirements.txt；不需要 pip install . 或 uv sync。
[tool.ruff]
target-version = "py312"
line-length = 120
src = ["."]
extend-exclude = [".runtime", ".venv", "data", "static", "investment-dashboard"]

# 仅检查明显的语法与未定义名称问题；不会自动格式化或重写既有业务代码。
[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
