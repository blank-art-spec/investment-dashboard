name: 功能建议
description: 说明需要解决的使用问题
title: "[建议] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 写明当前使用中遇到的具体困难。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望行为
      description: 说明页面、数据或流程应如何变化。
    validations:
      required: true
